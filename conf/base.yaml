defaults:
  - dev: local

# force re-generate dataset files
u: false
# max evaluations for hyperopt search
max_evals: 1
description: ""
init_model: false

# preconditioner epochs (only for 'pre-' pipelines)
pre_epochs: 40
full_epochs: 1
target: train

# Additive Schwarz flag (defaults to Multiplicative Schwarz)
ASM: false
gamma_algo: none
optim: Adam
optim_params:
  use_norms: false
  clamp_momentum: true
  momentum_type: ema
  beta: 0.9

ll_resolution: 0
gamma_lr: 0.01
gamma_strat: direct

seed: 42
epochs: 100

# Adagrad
full_batches: all
coarse_batches: 0
coarse_level: 1
